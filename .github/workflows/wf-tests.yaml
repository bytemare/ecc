name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.25', '1.24', '1.23' ]
    uses: bytemare/workflows/.github/workflows/test-go.yaml@13fd69c7f23bba4b578973cebe17daa1e9839221
    with:
      version: ${{ matrix.go }}
