version: "2"
linters:
  default: all
  disable:
    - embeddedstructfieldcheck
    - gochecknoglobals
    - gochecknoinits
    - interfacebloat
    - noinlineerr
    - nonamedreturns
    - varnamelen
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - golang.org/x/crypto/*
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*ecc/Element).MarshalBinary
        - (*ecc/Scalar).MarshalBinary
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
      default-case-required: true
    exhaustruct:
      exclude:
        - '.+/._'
    gocritic:
      enable-all: true
      disabled-checks:
        - commentedOutCode
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    interfacebloat:
      max: 11
    ireturn:
      allow:
        - error
        - generic
        - internal.Element
        - internal.Group
        - internal.Scalar
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - '2'
        - '3'
        - '7'
        - '8'
        - '10'
        - '33'
        - '48'
        - '64'
        - '66'
      ignored-functions:
        - 'nist.setMapping'
        - 'big.NewInt'
        - 'hash2curve.HashToFieldXMD'
    nlreturn:
      block-size: 2
    nolintlint:
      require-explanation: true
      require-specific: true
    prealloc:
      simple: false
      range-loops: true
      for-loops: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    rules:
      - linters:
          - exhaustruct
        text: "is missing field _"
      - path: debug/debug\.go
        linters:
          - dupl
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/bytemare/ecc)
        - blank
        - dot
        - alias
      no-inline-comments: true
      no-prefix-comments: true
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/bytemare/ecc
    golines:
      max-len: 200
output:
  sort-order:
    - file
run:
  tests: false
